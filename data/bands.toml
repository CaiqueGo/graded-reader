# Where a word sits on the CEFR scale.
#
# These numbers are calibrated guesses, not truth. The NGSL is a general
# frequency list, not an official CEFR mapping. They live in this file, and not
# in the code, precisely so you can move them: after twenty texts, compare how
# hard a text *felt* against the coverage it scored, and adjust.

[ngsl]
# Inclusive ceiling of the NGSL rank for each band. A word ranked 1..500 is A1,
# 501..1000 is A2, and so on. The list stops at 2809.
A1 = 500
A2 = 1000
B1 = 2000
B2 = 2809

[zipf]
# Words absent from the NGSL fall back to the wordfreq Zipf scale, which is
# open ended. Each entry is the inclusive floor for that band; anything below
# the lowest floor is C2. Unknown words score 0.0 and land in C2, which is the
# behaviour we want: a word nobody counted is not a word a beginner knows.
#
# The floors above B2 exist because the NGSL and the lemmatiser disagree about
# function words. The list has "they", "this", "he" and "a" as headwords, while
# spaCy leaves "their", "these", "his" and "an" as themselves -- so thirteen of
# the most common words in English matched nothing, fell through to this scale,
# and were called B2. Every text containing "my" or "your" was penalised for it.
#
# The numbers are the median Zipf of each NGSL band, measured rather than
# guessed: A1 5.43, A2 4.96, B1 4.59. Rounded down a little, because a word
# frequent enough to be missing from a 2809-word list and still this common is
# almost always an inflected function word.
A1 = 5.4
A2 = 4.9
B1 = 4.5
B2 = 4.0
C1 = 3.0

[coverage]
# Minimum share of in-band tokens for a text to count as being at that level.
# Higher levels tolerate more unknown words because the reader has the tools to
# infer them from context.
A1 = 0.95
A2 = 0.95
B1 = 0.92
B2 = 0.92
C1 = 0.90
C2 = 0.90
