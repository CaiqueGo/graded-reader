[project]
name = "graded-reader"
version = "0.1.0"
description = "A graded English reader with its own flashcards and a progress dashboard."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Each group arrives with the milestone that needs it.
lexicon = ["spacy>=3.7", "wordfreq>=3.1"]
db = ["sqlmodel>=0.0.22"]
srs = ["fsrs>=6.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
# Fetching a source and handing it to the Claude Code CLI. The CLI itself is
# not a Python package -- it has to be on PATH and logged in.
adapt = ["httpx>=0.27", "trafilatura>=2.0"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
reader = "graded_reader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graded_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Nenhum dos dois publica type stubs completos.
module = ["spacy.*", "wordfreq.*"]
ignore_missing_imports = true
