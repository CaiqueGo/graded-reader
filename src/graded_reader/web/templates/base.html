<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Graded Reader{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('app.css') }}">
  <script src="{{ static_url('htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Graded Reader</a>
    <nav class="tabs">
      <a href="/" class="tab {% if tab == 'reading' %}is-active{% endif %}">Reading</a>
      <a href="/review" class="tab {% if tab == 'review' %}is-active{% endif %}">Review</a>
      <a href="/dashboard" class="tab {% if tab == 'dashboard' %}is-active{% endif %}">Dashboard</a>
    </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
